name: Rebuild Homework 4 Poster

on:
  push:
    branches: [main]
    paths:
      - 'homework-4/poster/poster.html'
      - 'homework-4/poster/poster.css'
      - 'homework-4/images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF export dependencies
        run: npm install --no-save playwright-core pdf-lib
      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found" >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Export and validate 18x24 poster
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.path }}
        run: node homework-4/scripts/export_poster.cjs
      - name: Commit rebuilt poster
        shell: bash
        run: |
          if git diff --quiet -- homework-4/poster/Caleb_Katz_Econ238_HW4_Poster.pdf; then
            echo "Poster PDF is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homework-4/poster/Caleb_Katz_Econ238_HW4_Poster.pdf
          git commit -m "Rebuild Homework 4 poster PDF"
          git push
